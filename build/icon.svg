<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>OpenCode Projects Studio</title>
  <!-- The Kilo mark: the same rounded-square "K" as the sidebar logo and the
       site favicon, scaled to 80% so the finished glyph sits inside the canvas
       like the other icons on the desktop instead of bleeding to its edges.
       Rasterize with `npm run icon`. -->
  <g transform="translate(6.4 6.4) scale(0.8)">
    <rect width="64" height="64" rx="15" ry="15" fill="#c96442" />
    <text x="32" y="32" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="central">K</text>
  </g>
</svg>
